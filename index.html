<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/logos/logo-001.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>camara visual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Helvetica+Neue:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #000000;
            --bg-light: #ffffff;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
            --accent: #888888;
            --border: #e0e0e0;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-serif);
            background-color: var(--bg-dark);
            color: var(--text-light);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            overflow-x: hidden;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        body.theme-light {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: color 0.2s ease;
        }

        ul {
            list-style: none;
        }

        h1, h2, h3, h4 {
            font-weight: 300;
            font-family: var(--font-serif);
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-sans);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.theme-light nav {
            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .nav-inner {
            display: flex;
            gap: 50px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            height: 35px;
            z-index: 102;
        }

        .nav-logo a {
            display: block;
            height: 100%;
        }

        .nav-logo img {
            height: 100%;
            width: auto;
            max-width: 100%;
            display: block;
            transition: filter 0.3s ease;
            mix-blend-mode: screen;
        }

        body.theme-light .nav-logo img {
            filter: invert(1);
            mix-blend-mode: multiply;
        }

        .nav-item {
            position: relative;
        }

        .nav-item > a {
            cursor: pointer;
        }
        
        .nav-item > a:hover {
            color: var(--accent);
        }

        .dropdown {
            position: absolute;
            top: 100%;
            left: -15px;
            padding-top: 20px;
            padding-left: 15px;
            padding-bottom: 15px;
            padding-right: 30px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.2s ease-out;
            min-width: 180px;
            background: transparent;
        }
        
        body.theme-light .dropdown {
            background: rgba(255, 255, 255, 0.98);
        }

        .nav-item:hover .dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown li {
            margin-bottom: 12px;
        }

        .dropdown a:hover {
            color: var(--accent);
        }

        .mobile-menu-btn {
            display: none;
            cursor: pointer;
            z-index: 101;
            font-family: var(--font-sans);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
        }

        /* App Container */
        #app {
            min-height: 100vh;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        
        #app.fade-out {
            opacity: 0;
        }

        /* Home Page */
        .home-page {
            height: 100vh;
            width: 100vw;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .home-video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: var(--bg-dark);
        }

        .home-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        .home-title {
            font-size: clamp(48px, 6vw, 64px);
            font-weight: 300;
            letter-spacing: 4px;
            text-align: center;
            color: var(--text-light);
            text-transform: none;
        }

        /* Works Page */
        .works-page {
            padding: 120px 60px 60px;
            width: 100%;
            max-width: 2000px;
            margin: 0 auto;
        }

        .works-header {
            margin-bottom: 40px;
        }

        .works-title {
            font-size: 36px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .artist-statement-btn {
            font-family: var(--font-sans);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--accent);
            border-bottom: 1px solid var(--accent);
            padding-bottom: 2px;
            transition: color 0.2s, border-color 0.2s;
        }

        .artist-statement-btn:hover {
            color: var(--text-dark);
            border-color: var(--text-dark);
        }

        .artist-statement-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 680px;
        }

        .artist-statement-panel.open {
            max-height: 1000px;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .works-gallery {
            column-count: 3;
            column-gap: 20px;
            width: 100%;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }
        
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-family: var(--font-sans);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            gap: 10px;
        }

        .gallery-item:hover .gallery-caption {
            opacity: 1;
        }
        
        .gallery-caption .number {
            color: #ccc;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.97);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .lightbox.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            display: block;
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 35px;
            cursor: pointer;
            font-family: var(--font-sans);
            line-height: 1;
            padding: 10px;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 1010;
        }
        
        .lightbox-close:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        
        .lightbox-nav:hover {
            opacity: 1;
        }

        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        
        .lightbox-caption {
            position: absolute;
            bottom: -35px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-family: var(--font-sans);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Information Pages */
        .info-page {
            padding: 150px 40px 80px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .info-content {
            max-width: 680px;
            margin: 0 auto;
            font-size: 17px;
            color: #333;
        }

        .info-title {
            font-size: 36px;
            margin-bottom: 60px;
            text-align: center;
            font-style: italic;
        }

        /* Books Page */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
        }

        .book-card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .book-title {
            font-family: var(--font-sans);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: var(--text-dark);
        }

        /* Exhibitions & Articles */
        .list-item {
            padding: 25px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 40px;
        }
        
        .list-item .year, .list-item .date {
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--accent);
            width: 80px;
            flex-shrink: 0;
            margin-top: 3px;
        }

        /* FAQs */
        .faq-item {
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
        }

        .faq-question {
            font-family: var(--font-sans);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-dark);
            transition: color 0.2s;
        }
        
        .faq-question:hover {
            color: var(--accent);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0, 1, 0, 1);
            padding-top: 0;
        }

        .faq-item.active .faq-answer {
            padding-top: 20px;
            max-height: 500px;
            transition: max-height 0.4s ease-in-out, padding 0.4s ease-in-out;
        }

        /* Contact Form */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-top: 40px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            color: inherit;
            font-family: var(--font-sans);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .form-group select {
            cursor: pointer;
            border-radius: 0;
        }
        
        .form-group select option {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-bottom-color: var(--text-dark);
        }
        
        .form-group input::placeholder, .form-group textarea::placeholder {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            align-self: flex-start;
            padding: 12px 35px;
            background: transparent;
            color: var(--text-dark);
            border: 1px solid var(--border);
            font-family: var(--font-sans);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: var(--text-dark);
            color: var(--bg-light);
            border-color: var(--text-dark);
        }

        /* Responsive */
        @media (max-width: 1199px) {
            .works-gallery {
                column-count: 2;
            }
            .books-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 767px) {
            nav {
                padding: 20px;
            }
            .nav-logo {
                height: 25px;
            }
            body.theme-light .nav-inner.active ~ .nav-logo img {
                filter: none;
            }
            .lightbox-close {
                top: 20px;
                right: 20px;
                font-size: 30px;
            }
            .nav-inner {
                display: none;
                flex-direction: column;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                background: var(--bg-dark);
                color: var(--text-light);
                padding: 80px 40px 40px;
                gap: 30px;
                z-index: 99;
            }
            .nav-inner.active {
                display: flex;
            }
            body.theme-light .nav-inner {
                background: rgba(255, 255, 255, 0.98);
                color: var(--text-dark);
            }
            .dropdown {
                position: static;
                opacity: 1;
                visibility: visible;
                transform: none;
                padding-top: 15px;
                padding-left: 15px;
                display: none;
                background: transparent !important;
            }
            .nav-item.active .dropdown {
                display: block;
            }
            .mobile-menu-btn {
                display: block;
                position: relative;
                z-index: 102;
            }
            .works-page {
                padding: 100px 20px 40px;
            }
            .works-gallery {
                column-count: 1;
            }
            .books-grid {
                grid-template-columns: 1fr;
            }
            .info-page {
                padding: 100px 20px 60px;
            }
            .list-item {
                flex-direction: column;
                gap: 10px;
            }
            .lightbox-prev, .lightbox-next {
                display: none;
            }
            .lightbox-caption {
                font-size: 10px;
                bottom: -25px;
            }
        }
    </style>
</head>
<body>

    <nav id="main-nav">
        <div class="mobile-menu-btn" onclick="toggleMobileMenu()">MENU</div>
        <ul class="nav-inner" id="nav-inner">
            <li class="nav-item">
                <a>Works</a>
                <ul class="dropdown">
                    <li><a href="#works/portraits">Portraits</a></li>
                    <li><a href="#works/editorial">Editorial</a></li>

                <ul class="dropdown">

        </ul>

    <div id="app"></div>
    
    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" onclick="closeLightbox()">&times;</div>
        <div class="lightbox-nav lightbox-prev" onclick="changeLightbox(-1)">&#10094;</div>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
        <div class="lightbox-nav lightbox-next" onclick="changeLightbox(1)">&#10095;</div>
    </div>

    <script>
        // Data Structure
                const worksData = {
            portraits: {
                title: "Portraits",
                statement: "Capturing the essence and personality of the subject through compelling portrait photography.",
                images: [
                    "assets/portraits/portrait-001.webp",
                    "assets/portraits/portrait-002.webp",
                    "assets/portraits/portrait-003.webp",
                    "assets/portraits/portrait-004.webp"
                ]
            },
            editorial: {
                title: "Editorial",
                statement: "Visual storytelling tailored for publications, blending fashion, lifestyle, and narrative elements.",
                images: [
                    "assets/editorial/editorial-001.webp",
                    "assets/editorial/editorial-002.webp",
                    "assets/editorial/editorial-003.webp",
                    "assets/editorial/editorial-004.webp",
                    "assets/editorial/editorial-005.webp",
                    "assets/editorial/editorial-006.webp",
                    "assets/editorial/editorial-007.webp"
                ]
            },
            'beauty-retouch': {
                title: "Beauty Retouch",

                images: [

            },
            ecommerce: {
                title: "Ecommerce",
                statement: "Clean, consistent, and high-quality product photography designed to elevate online retail experiences.",
                images: [

                    "assets/ecommerce/ecommerce-002.webp",
                    "assets/ecommerce/ecommerce-003.webp",
                    "assets/ecommerce/ecommerce-004.webp",
                    "assets/ecommerce/ecommerce-005.webp",
                    "assets/ecommerce/ecommerce-006.webp",
                    "assets/ecommerce/ecommerce-007.webp"
                ]
            },
            events: {
                title: "Events (Weddings & Birthdays)",
                statement: "Documenting life's most precious moments with candid and elegant event coverage.",
                images: [
                    "assets/events/event-001.webp",
                    "assets/events/event-002.webp",
                    "assets/events/event-003.webp",
                    "assets/events/event-004.webp",
                    "assets/events/event-005.webp"
                ]
            },
            'natural-light': {
                title: "Natural Light",
                statement: "Harnessing the beauty of available light to create authentic, soft, and cinematic visuals.",
                images: [
                    "assets/natural-light/natural-light-001.webp",
                    "assets/natural-light/natural-light-002.webp",
                    "assets/natural-light/natural-light-003.webp",
                    "assets/natural-light/natural-light-004.webp",
                    "assets/natural-light/natural-light-005.webp"
                ]
            },
            'black-white': {
                title: "Black & white",
                statement: "Focusing on contrast, texture, and emotion through the timeless medium of black and white photography.",
                images: [
                    "assets/black-white/black-white-001.webp",
                    "assets/black-white/black-white-002.webp",
                    "assets/black-white/black-white-003.webp",
                    "assets/black-white/black-white-004.webp",
                    "assets/black-white/black-white-005.webp",
                    "assets/black-white/black-white-006.webp"
                ]
            },
            'corporate-headshots': {
                title: "Corporate Headshots",
                statement: "Professional, polished, and approachable headshots for modern business communication.",
                images: [
                    "assets/corporate-headshots/corporate-headshot-001.webp",
                    "assets/corporate-headshots/corporate-headshot-002.webp",
                    "assets/corporate-headshots/corporate-headshot-003.webp",
                    "assets/corporate-headshots/corporate-headshot-004.webp",
                    "assets/corporate-headshots/corporate-headshot-005.webp",
                    "assets/corporate-headshots/corporate-headshot-006.webp"
                ]
            }
        };

        const booksData = [
            { title: "Equus", year: 2008, desc: "A sweeping, global study of the horse." },
            { title: "DogsGods", year: 2010, desc: "Portraits exploring the human-dog bond." },
            { title: "More Than Human", year: 2012, desc: "Intimate animal portraits bridging the species divide." },
            { title: "Evolution", year: 2013, desc: "A visual exploration of scientific evolution." },
            { title: "Endangered", year: 2017, desc: "A powerful tribute to species on the edge." },
            { title: "Who am I?", year: 2019, desc: "An introspective look into animal identity." },
            { title: "Birds", year: 2021, desc: "The stunning diversity of avian life." }
        ];

        const homeVideos = [
            "assets/videos/home-video.mov?v=3"
        ];

        // Routing & Rendering
        const app = document.getElementById('app');

        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('load', handleRoute);

        function handleRoute() {
            let hash = window.location.hash.slice(1);
            if (!hash) hash = 'home';
            
            const [section, page] = hash.split('/');
            
            app.classList.add('fade-out');
            
            setTimeout(() => {
                if (section === 'home') {
                    renderHome();
                } else if (section === 'works') {
                    renderWorks(page || 'portraits');
                } else if (section === 'bookings') {
                    renderInfo(page || 'about');
                } else {
                    renderHome();
                }
                
                app.classList.remove('fade-out');
                window.scrollTo(0, 0);
                closeMobileMenu();
            }, 300);
        }

        function renderHome() {
            document.body.classList.remove('theme-light');
            app.innerHTML = `
                <div class="home-page">
                    <div class="home-video-container">
                        <video id="home-video" autoplay muted playsinline loop poster="assets/editorial/editorial-001.webp?v=3" src="${homeVideos[0]}">
                        </video>
                    </div>
                    <h1 class="home-title">camara visual</h1>
                </div>
            `;
            
            // Setup Video Loop (fallback for multiple videos if needed)
            const videoEl = document.getElementById('home-video');
            if (videoEl && homeVideos.length > 1) {
                let currentVideoIdx = 0;
                videoEl.removeAttribute('loop');
                videoEl.addEventListener('ended', () => {
                    currentVideoIdx = (currentVideoIdx + 1) % homeVideos.length;
                    videoEl.src = homeVideos[currentVideoIdx];
                    videoEl.play().catch(e => console.log('Autoplay handled by browser constraints'));
                });
            }
        }

        // Helper to generate varied dimensions for masonry layout
        function getMasonryDimensions(index) {
            const pattern = index % 5;
            if (pattern === 0) return '1200/900';   // Landscape
            if (pattern === 1) return '900/1200';   // Portrait
            if (pattern === 2) return '1000/1000';  // Square
            if (pattern === 3) return '1200/800';   // Wide
            return '800/1000';                      // Tall
        }

        function renderWorks(category) {
            document.body.classList.add('theme-light');
            const work = worksData[category];
            if (!work) {
                window.location.hash = 'works/portraits';
                return;
            }
            
            let galleryHTML = work.images.map((path, index) => {
                const title = path.split('/').pop().split('.')[0].replace('-', ' ');
                return `
                    <div class="gallery-item" onclick="openLightbox('${category}', ${index})">
                        <img src="${path}?v=3" alt="${title}" loading="lazy">
                        <div class="gallery-caption">
                            <span class="number">${index + 1}</span>
                            <span class="title">${title}</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            app.innerHTML = `
                <div class="works-page">
                    <div class="works-header">
                        <h2 class="works-title">${work.title}</h2>
                        <button class="artist-statement-btn" onclick="toggleStatement()">Artist Statement</button>
                    </div>
                    <div class="artist-statement-panel" id="statement-panel">
                        <div class="info-content" style="margin: 0; padding-bottom: 20px;">
                            <p>${work.statement}</p>
                            <p style="margin-top: 15px;">
                                <a href="#" style="text-decoration: underline; font-family: var(--font-sans); font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Download PDF</a>
                            </p>
                        </div>
                    </div>
                    <div class="works-gallery">
                        ${galleryHTML}
                    </div>
                </div>
            `;
        }

        function renderInfo(page) {
            document.body.classList.add('theme-light');
            
            // Redirect booking to pricing since they are now unified
            if (page === 'booking') {
                window.location.hash = 'bookings/pricing';
                return;
            }
            
            let content = '';
            let title = page.charAt(0).toUpperCase() + page.slice(1);
            
            if (page === 'about') {
                content = `
                    <div class="info-content">
                        <p>camara visual is known for his captivating and thought-provoking images of the animal kingdom. He captures both the power and vulnerability of animals, highlighting their undeniable connection with humans and transporting audiences to a new visual perspective on wildlife and conservation.</p>
                        <br>
                        <p>Flach has five main bodies of work which have been exhibited worldwide, including Museums of Natural History, from Paris to Beijing. He has seven international award-winning books, translated into multiple languages.</p>
                        <br>
                        <p style="text-align: center; font-style: italic; font-size: 15px;">Portraits &mdash; Editorial &mdash; Beauty Retouch &mdash; Ecommerce &mdash; Events &mdash; Natural Light &mdash; Black & white &mdash; Corporate Headshots</p>
                        <br>
                        <p>Tim has been awarded an Honorary Doctorate from the University of the Arts London (Norwich) and an Honorary Fellowship by the Royal Photographic Society. He is also a Senior Research Fellow (Artist in Residence) at Centre for Eudaimonia and Human Flourishing at Linacre College, University of Oxford, and serves as President of the Association of Photographers.</p>
                        <br>
                        <p>He lives in London with his wife and son.</p>
                    </div>
                `;
            } else if (page === 'pricing') {
                content = `
                    <div class="info-content">
                        <div class="list-item" style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <div style="text-transform: uppercase; letter-spacing: 1px; font-size: 14px; margin-bottom: 5px; color: var(--text-dark);">Portraits & Headshots</div>
                                <div style="font-style: italic; color: #666;">1 hour session, 10 retouched photos</div>
                            </div>
                            <div class="year" style="font-size: 16px; width: auto;">Starting at $300</div>
                        </div>
                        <div class="list-item" style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <div style="text-transform: uppercase; letter-spacing: 1px; font-size: 14px; margin-bottom: 5px; color: var(--text-dark);">Editorial & Beauty Retouch</div>
                                <div style="font-style: italic; color: #666;">Half-day studio session</div>
                            </div>
                            <div class="year" style="font-size: 16px; width: auto;">Starting at $800</div>
                        </div>
                        <div class="list-item" style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <div style="text-transform: uppercase; letter-spacing: 1px; font-size: 14px; margin-bottom: 5px; color: var(--text-dark);">Event Coverage</div>
                                <div style="font-style: italic; color: #666;">Weddings, Birthdays, Corporate Events</div>
                            </div>
                            <div class="year" style="font-size: 16px; width: auto;">Custom Quote</div>
                        </div>
                        
                        <div style="margin-top: 60px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 40px;">
                            <h3 style="text-transform: uppercase; letter-spacing: 2px; font-size: 15px; margin-bottom: 20px; font-family: var(--font-sans); text-align: center; color: var(--text-dark);">Request a Session</h3>
                            <form class="contact-form" onsubmit="event.preventDefault(); alert('Inquiry submitted successfully!');">
                                <div class="form-group">
                                    <input type="text" placeholder="Full Name" required>
                                </div>
                                <div class="form-group">
                                    <input type="email" placeholder="Email Address" required>
                                </div>
                                <div class="form-group">
                                    <input type="tel" placeholder="Phone Number" required>
                                </div>
                                <div class="form-group">
                                    <select required style="color: #666;" onchange="this.style.color='var(--text-dark)'">
                                        <option value="" disabled selected hidden>How did you hear about my work?</option>
                                        <option value="Instagram">Instagram</option>
                                        <option value="Word of Mouth">Word of Mouth</option>
                                        <option value="Google">Google</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <select required style="color: #666;" onchange="this.style.color='var(--text-dark)'">
                                        <option value="" disabled selected hidden>What type of photoshoot would you like to book?</option>
                                        <option value="Portraits & Headshots">Portraits & Headshots</option>
                                        <option value="Wedding">Wedding</option>
                                        <option value="Events">Events</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <input type="text" placeholder="Which package are you interested in?" required>
                                </div>
                                <div class="form-group">
                                    <select required style="color: #666;" onchange="this.style.color='var(--text-dark)'">
                                        <option value="" disabled selected hidden>Where will the photoshoot take place?</option>
                                        <option value="Studio">Studio</option>
                                        <option value="Outdoor">Outdoor</option>
                                        <option value="Event Venue">Event Venue</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <input type="text" placeholder="Date of the photoshoot/event" onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'" required>
                                </div>
                                <div class="form-group">
                                    <input type="text" placeholder="Venue Address" required>
                                </div>
                                <div class="form-group">
                                    <textarea placeholder="What do you like most about my photography style?" required></textarea>
                                </div>
                                <button type="submit" class="submit-btn" style="margin-top: 10px;">Submit Inquiry</button>
                            </form>
                        </div>
                    </div>
                `;
            } else if (page === 'faqs') {
                const questions = [
                    "Do you sell prints of your work?",
                    "How can I license an image for commercial use?",
                    "Are you available for commercial commissions?",
                    "Where can I see your exhibitions?",
                    "Which camera equipment do you use?",
                    "How do you approach lighting your animal subjects?"
                ];
                const faqsHTML = questions.map(q => `
                    <div class="faq-item" onclick="toggleFaq(this)">
                        <div class="faq-question">
                            ${q}
                            <span class="icon">+</span>
                        </div>
                        <div class="faq-answer">
                            <p style="font-size: 15px; color: #555; line-height: 1.6;">For inquiries related to this topic, please contact the studio via the Contact page. Our team handles print sales, image licensing, and commission requests directly. Thank you for your interest in camara visual's photography.</p>
                        </div>
                    </div>
                `).join('');
                content = `<div class="info-content">${faqsHTML}</div>`;
            } else if (page === 'contact') {
                content = `
                    <div class="info-content">
                        <p style="margin-bottom: 20px;">For general enquiries, print sales, or commission requests, please use the form below or contact our London studio directly.</p>
                        <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                            <div class="form-group">
                                <input type="text" placeholder="Name" required>
                            </div>
                            <div class="form-group">
                                <input type="email" placeholder="Email" required>
                            </div>
                            <div class="form-group">
                                <textarea placeholder="Message" required></textarea>
                            </div>
                            <button type="submit" class="submit-btn">Submit</button>
                        </form>
                        <div style="margin-top: 80px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid var(--border); padding-top: 40px;">
                            <p style="color: var(--accent); margin-bottom: 5px;">Studio Address</p>
                            <p style="color: var(--text-dark);">London, UK<br>Please contact us to arrange a visit.</p>
                        </div>
                    </div>
                `;
            }
            
            app.innerHTML = `
                <div class="info-page">
                    <h1 class="info-title">${title}</h1>
                    ${content}
                </div>
            `;
        }

        // Interactions
        function toggleStatement() {
            const panel = document.getElementById('statement-panel');
            panel.classList.toggle('open');
        }

        function toggleFaq(element) {
            const isActive = element.classList.contains('active');
            
            document.querySelectorAll('.faq-item').forEach(el => {
                el.classList.remove('active');
                el.querySelector('.icon').textContent = '+';
            });
            
            if (!isActive) {
                element.classList.add('active');
                element.querySelector('.icon').textContent = '-';
            }
        }

        // Lightbox
        let currentGallery = [];
        let currentCategory = '';
        let currentImageIndex = 0;

        function openLightbox(category, index) {
            currentCategory = category;
            currentImageIndex = index;
            currentGallery = worksData[category].images;
            
            updateLightboxImage();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function changeLightbox(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = currentGallery.length - 1;
            if (currentImageIndex >= currentGallery.length) currentImageIndex = 0;
            updateLightboxImage();
        }

        function updateLightboxImage() {
            const img = document.getElementById('lightbox-img');
            const caption = document.getElementById('lightbox-caption');
            
            const path = currentGallery[currentImageIndex];
            const title = path.split('/').pop().split('.')[0].replace('-', ' ');
            
            img.src = path + '?v=3';
            caption.textContent = `${currentImageIndex + 1} / ${currentGallery.length} — ${title}`;
        }

        // Keyboard navigation for Lightbox
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') changeLightbox(-1);
            if (e.key === 'ArrowRight') changeLightbox(1);
        });

        // Mobile Menu
        function toggleMobileMenu() {
            document.getElementById('nav-inner').classList.toggle('active');
            const btn = document.querySelector('.mobile-menu-btn');
            if (document.getElementById('nav-inner').classList.contains('active')) {
                btn.textContent = 'CLOSE';
            } else {
                btn.textContent = 'MENU';
            }
        }

        function closeMobileMenu() {
            document.getElementById('nav-inner').classList.remove('active');
            document.querySelector('.mobile-menu-btn').textContent = 'MENU';
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        }

        document.querySelectorAll('.nav-item > a').forEach(link => {
            link.addEventListener('click', (e) => {
                if (window.innerWidth < 768) {
                    const item = e.target.parentElement;
                    item.classList.toggle('active');
                }
            });
        });

    </script>
</body>
</html>
